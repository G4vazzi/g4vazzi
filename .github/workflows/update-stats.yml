
name: Atualizar estatisticas de linguagens

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/generate_chart.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  generate-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar grafico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_chart.py

      - name: Salvar grafico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/languages.svg

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza grafico de linguagens"
            git push
          else
            echo "Nenhuma alteracao encontrada."
          fi
